spring.application.name=user-service

server.port=8082

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

spring.datasource.url=jdbc:h2:mem:users_db
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

resilience4j.circuitbreaker.instances.computerService.sliding-window-size=2
resilience4j.circuitbreaker.instances.computerService.minimum-number-of-calls=2
resilience4j.circuitbreaker.instances.computerService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.computerService.wait-duration-in-open-state=10s

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest